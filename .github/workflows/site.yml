name: Site
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, closed]
  push:
    branches: [main, develop]
permissions:
  contents: read
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false
jobs:
  production-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check production PR source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != pull_request || "$BASE_REF" != production ]]; then
            exit 0
          fi
          case "$HEAD_REF" in
            develop|release/?*|hotfix/?*) ;;
            *) echo '::error::Production accepts PRs only from develop, release/* or hotfix/*'; exit 1 ;;
          esac
  verify:
    needs: production-source
    if: github.event.action != 'closed' || (github.event.pull_request.merged == true && github.base_ref == 'production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.merge_commit_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - name: Linux deployment integration
        run: |
          docker compose -f deploy/compose.yaml config --quiet
          docker compose -f tests/deploy.compose.yaml run --rm site nginx -t
          docker compose -f tests/deploy.compose.yaml up --abort-on-container-exit --exit-code-from test
      - name: Clean integration environment
        if: always()
        run: docker compose -f tests/deploy.compose.yaml down --volumes
      - name: Record release identity
        env:
          RELEASE_SHA: ${{ github.event.action == 'closed' && github.event.pull_request.merge_commit_sha || github.sha }}
        run: node --input-type=module -e "import {writeFileSync} from 'node:fs'; writeFileSync('out/release.json', JSON.stringify({sha:process.env.RELEASE_SHA,run:Number(process.env.GITHUB_RUN_NUMBER),attempt:Number(process.env.GITHUB_RUN_ATTEMPT)}));"
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out
  deploy:
    needs: [production-source, verify]
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.base_ref == 'production'
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: out
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Upload and activate
        shell: bash
        run: |
          set -euo pipefail
          release="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}"
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh -o StrictHostKeyChecking=yes "$target" "mkdir -p /srv/kolyach-dev/releases/$release"
          rsync -az --chmod=D755,F644 -e 'ssh -o StrictHostKeyChecking=yes' out/ "$target:/srv/kolyach-dev/releases/$release/"
          ssh -o StrictHostKeyChecking=yes "$target" "/opt/node24/bin/node /srv/kolyach-dev/tools/scripts/activate-release.mjs /srv/kolyach-dev $release"
