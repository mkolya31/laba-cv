# Internal HTTP service; TLS and ACME belong to the shared gateway.
server {
    listen 80;
    server_name _;
    root /srv/kolyach-dev/live/current;
    include /etc/nginx/mime.types;
    add_header X-Content-Type-Options nosniff always;
    gzip on;
    gzip_types text/css application/javascript application/json;
    location = /runtime-config.json {
        alias /srv/kolyach-dev/shared/runtime-config.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        open_file_cache off;
        etag off;
        if_modified_since off;
    }
    location = /resume.pdf {
        alias /srv/kolyach-dev/shared/resume.pdf;
        default_type application/pdf;
        add_header Cache-Control "no-store" always;
        open_file_cache off;
        etag off;
        if_modified_since off;
    }
    location ~ (^|/)\. { deny all; }
    location = /release.json { add_header Cache-Control "no-store" always; }
    location /_next/static/ {
        alias /srv/kolyach-dev/assets/_next/static/; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location / { try_files $uri $uri.html $uri/ =404; add_header Cache-Control "no-cache"; }
}
