# Замените домен и пути сертификата перед установкой. Только отдельный virtual host.
server {
    listen 80;
    server_name dev.kolyach.me;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name dev.kolyach.me;
    ssl_certificate /etc/letsencrypt/live/dev.kolyach.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.kolyach.me/privkey.pem;
    root /srv/kolyach-dev/current;
    include /etc/nginx/mime.types;
    add_header X-Content-Type-Options nosniff always;
    gzip on;
    gzip_types text/css application/javascript application/json;
    location = /runtime-config.json {
        alias /srv/kolyach-dev/shared/runtime-config.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        open_file_cache off;
        etag off;
        if_modified_since off;
    }
    location = /resume.pdf {
        alias /srv/kolyach-dev/shared/resume.pdf;
        default_type application/pdf;
        add_header Cache-Control "no-store" always;
        open_file_cache off;
        etag off;
        if_modified_since off;
    }
    location /_next/static/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location / { try_files $uri $uri.html $uri/ =404; add_header Cache-Control "no-cache"; }
}
