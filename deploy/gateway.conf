server {
    listen 80;
    server_name dev.kolyach.me;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name dev.kolyach.me;
    ssl_certificate /etc/letsencrypt/live/dev.kolyach.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.kolyach.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $site_upstream http://kolyach-dev:80;
        proxy_pass $site_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
